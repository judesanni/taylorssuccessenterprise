  - name: "portfolio_galleries"
    label: "Portfolio Galleries"
    files:
      - name: "portfolio_galleries"
        label: "Six Portfolio Galleries"
        file: "data/portfolio-galleries.json"
        format: "json"
        fields:
          - label: "Galleries"
            name: "galleries"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Gallery ID", name: "id", widget: "string" }
              - { label: "Gallery title", name: "title", widget: "string" }
              - { label: "Gallery introduction", name: "description", widget: "text", required: false }
              - label: "Media items"
                name: "items"
                widget: "list"
                summary: "{{fields.type}} {{fields.videoId}}"
                fields:
                  - { label: "Type", name: "type", widget: "select", options: ["image", "video"] }
                  - { label: "Image (for photos)", name: "image", widget: "image", required: false }
                  - { label: "Vimeo video ID (for videos, digits only)", name: "videoId", widget: "string", required: false }

  - name: "site_content"
    label: "Website Content"
    files:
      - name: "grammy_season_event"
        label: "Grammy Season Event"
        file: "data/event-content.json"
        format: "json"
        fields:
          - { label: "Event eyebrow", name: "grammy_eyebrow", widget: "string" }
          - { label: "Event title", name: "grammy_title", widget: "string" }
          - { label: "Short event introduction", name: "grammy_subtitle", widget: "text" }
          - { label: "Event description", name: "grammy_description", widget: "text" }
          - { label: "Timing", name: "grammy_timing", widget: "string" }
          - { label: "Who it is for", name: "grammy_audience", widget: "string" }
          - { label: "Registration status", name: "grammy_registration", widget: "string" }
          - { label: "Inquiry button label", name: "grammy_cta_label", widget: "string" }
